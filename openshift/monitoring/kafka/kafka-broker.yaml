apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: monitoring
spec:
  serviceName: kafka
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000            # Ensures PVC mount is owned by gid=1000 (appuser group) — fixes AccessDeniedException
      initContainers:
        - name: init-node-id
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              NODE_ID=${POD_NAME##*-}
              echo $NODE_ID > /etc/kafka-node/node-id
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: node-id
              mountPath: /etc/kafka-node
      containers:
        - name: kafka
          image: apache/kafka:4.1.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              export KAFKA_NODE_ID=$(cat /etc/kafka-node/node-id)
              export KAFKA_ADVERTISED_LISTENERS="CLIENT://$(POD_NAME).kafka.monitoring.svc.cluster.local:9092,BROKER://$(POD_NAME).kafka.monitoring.svc.cluster.local:9093"
              exec /etc/kafka/docker/run
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_ID                              # apache/kafka image uses CLUSTER_ID not KAFKA_CLUSTER_ID
              value: "Gi6UrH-kT4i9NeINp9Sx4w"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.monitoring.svc.cluster.local:9094,1@kafka-1.kafka.monitoring.svc.cluster.local:9094,2@kafka-2.kafka.monitoring.svc.cluster.local:9094"
            - name: KAFKA_LISTENERS
              value: "CLIENT://:9092,BROKER://:9093,CONTROLLER://:9094"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CLIENT:PLAINTEXT,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "BROKER"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: broker
            - containerPort: 9094
              name: controller
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: node-id
              mountPath: /etc/kafka-node
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: node-id
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: crc-csi-hostpath-provisioner