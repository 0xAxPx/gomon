apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-aggregator-config
  namespace: monitoring
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: log
      enabled: true
      paths:
        - /var/log/aggregator.log
      fields:
        app: aggregator
        environment: monitoring
        service: metrics-aggregator
      fields_under_root: true
      
    output.elasticsearch:
      hosts: ["http://elasticsearch-lb:9200"]
      index: "filebeat-aggregator-%{+yyyy.MM.dd}"
      bulk_max_size: 200

    queue.mem:
      events: 2048
      flush.min_events: 200
      flush.timeout: 5s

    setup.ilm.enabled: false
    setup.template.name: "filebeat-aggregator"
    setup.template.pattern: "filebeat-aggregator-*"

    logging.level: info
    logging.to_stderr: true