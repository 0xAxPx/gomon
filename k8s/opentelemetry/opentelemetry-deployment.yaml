apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: monitoring
  labels:
    app: opentelemetry
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      memory_limiter:
        limit_mib: 400
        spike_limit_mib: 100
        check_interval: 1s
      batch:
        timeout: 15s
        send_batch_size: 1024

    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      otlphttp/victoriametrics:
        metrics_endpoint: http://victoria-metrics:8428/opentelemetry/api/v1/push
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check,zpages]
      telemetry:
        metrics:
          address: 0.0.0.0:8888  
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/victoriametrics]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry
  namespace: monitoring
  labels:
    app: opentelemetry
    managed-by: terraform 
    environment: development
    project: gomon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry
  template:
    metadata:
      labels:
        app: opentelemetry
    spec:
      containers:
        - name: opentelemetry
          image: otel/opentelemetry-collector-contrib:0.120.0
          args:
            - "--config=/etc/otelcol/config.yaml"
          ports:
            - containerPort: 4317   # OTLP gRPC
              name: otlp-grpc
            - containerPort: 8888   # collector self-metrics
              name: self-metrics
          volumeMounts:
            - name: otelcol-config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 13133          # collector health_check extension
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: otelcol-config
          configMap:
            name: otelcol-config

---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry
  namespace: monitoring
  labels:
    app: opentelemetry
    managed-by: terraform
    environment: development
    project: gomon
spec:
  type: ClusterIP
  selector:
    app: opentelemetry
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
      protocol: TCP
    - port: 8888
      targetPort: 8888
      name: self-metrics
      protocol: TCP
    - port: 55679       
      targetPort: 55679
      name: zpages
      protocol: TCP
